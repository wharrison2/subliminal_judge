# DPO hyperparameters. Values are those of Magistrali et al.'s pairwise-judge DPO runs
# (github.com/ETH-DISCO/subliminal-signals-in-preference-labels, cfgs/preference_numbers/
# judge_model_cfgs.py build_dpo_job), except epochs: 1 here (they use 3).
epochs: 1
beta: 0.1
lr: 5.0e-5
lr_schedule: linear
warmup_steps: 5
micro_batch: 2          # pairs per forward pass (per_device_train_batch_size)
grad_accum: 4           # effective batch = 8 pairs
max_grad_norm: 1.0
max_len: 500            # tokens, prompt + response
max_pairs: 30000
lora_r: 8
lora_alpha: 8
lora_dropout: 0.0
use_rslora: false
target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
weight_decay: 0.0
grad_checkpoint: false
checkpoint_every_steps: 100
